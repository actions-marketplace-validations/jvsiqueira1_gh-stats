name: "Languages Chart"
description: "Gera um gráfico SVG com as linguagens dos seus repositórios, incluindo os privados"
author: "jvsiqueira1"

branding:
  icon: "bar-chart-2"
  color: "blue"

inputs:
  token:
    description: "Token com acesso de leitura (Metadata) aos seus repositórios"
    required: true
  username:
    description: "Usuário do GitHub"
    default: ${{ github.repository_owner }}
  output:
    description: "Caminho do SVG gerado"
    default: "languages.svg"
  lang:
    description: "Idioma dos textos do gráfico: pt, en ou es"
    default: "pt"
  title:
    description: "Título do gráfico (padrão: o título do idioma escolhido)"
    default: ""
  themes:
    description: "Temas a gerar, separados por vírgula: auto, light, dark. light e dark geram arquivos com sufixo (languages-light.svg)"
    default: "auto"
  max_bars:
    description: "Quantidade de linguagens antes de agrupar o resto"
    default: "8"
  exclude_languages:
    description: "Linguagens a ignorar, separadas por vírgula (ex.: HTML, CSS)"
    default: ""
  exclude_repos:
    description: "Repositórios a ignorar, separados por vírgula (ex.: meu-repo, outro-repo)"
    default: ""
  include_private:
    description: "Incluir repositórios privados"
    default: "true"
  include_forks:
    description: "Incluir forks"
    default: "false"
  commit:
    description: "Fazer commit do SVG automaticamente"
    default: "true"
  commit_message:
    description: "Mensagem do commit"
    default: "chore: atualiza gráfico de linguagens"

outputs:
  files:
    description: "Arquivos gerados, um por linha"
    value: ${{ steps.generate.outputs.files }}

runs:
  using: "composite"
  steps:
    - name: Gerar gráfico
      id: generate
      shell: bash
      run: node "${{ github.action_path }}/src/index.mjs"
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_USERNAME: ${{ inputs.username }}
        OUTPUT: ${{ inputs.output }}
        CHART_LANG: ${{ inputs.lang }}
        TITLE: ${{ inputs.title }}
        THEMES: ${{ inputs.themes }}
        MAX_BARS: ${{ inputs.max_bars }}
        EXCLUDE_LANGUAGES: ${{ inputs.exclude_languages }}
        EXCLUDE_REPOS: ${{ inputs.exclude_repos }}
        INCLUDE_PRIVATE: ${{ inputs.include_private }}
        INCLUDE_FORKS: ${{ inputs.include_forks }}

    - name: Commit do SVG
      if: inputs.commit == 'true'
      shell: bash
      env:
        FILES: ${{ steps.generate.outputs.files }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        while IFS= read -r file; do
          [ -n "$file" ] && git add -- "$file"
        done <<< "$FILES"
        git diff --staged --quiet || (git commit -m "$COMMIT_MESSAGE" && git push)
